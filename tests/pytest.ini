[pytest]
# Recognise any test_*.py file under tests/
testpaths = .

# All async fixtures/tests run under asyncio without an explicit
# @pytest.mark.asyncio decorator. Keeps async test bodies concise.
asyncio_mode = auto

# Fail on unexpected framework-level deprecation warnings so we catch
# them early. Scoped to the agent_framework package so unrelated
# third-party deprecations do not spam the test output.
filterwarnings =
    error::DeprecationWarning:agent_framework.*

# Emit short traceback on failures by default — full traceback is
# opt-in via -v --tb=long for debugging sessions.
addopts = --tb=short
