# Agent Framework - Project configuration
# ---------------------------------------
# Copy this file to `environments.yaml` and tune it for your deployment.
# `environments.yaml` is gitignored. The framework falls back to this
# example when the real file is absent.
#
# This file is topology only: where to connect. Tokens and passwords stay
# in Aspire user-secrets, Compose environment variables, or Web UI
# bring-your-own-token storage. Do not put PATs, API keys, or passwords
# here. `jks_password_env` names an environment variable; it is not the
# password.
#
# This file is separate from the Datadog MCP `environments.json`.
#
# Lookup:
#   - Project keys and aliases are case-insensitive.
#   - Environment keys are case-insensitive.
#
# Capability blocks (all optional except `name`):
#   - certificate_profile : mTLS / test-user material references
#   - load_testing        : provider `blazemeter` plus provider fields
#   - project_management  : provider `azure_devops` or `jira`
#   - documentation       : provider `confluence` (`mode`: cloud | onprem)
#   - environments        : env name -> {url, label, description}
#
# A2A callers may still override BlazeMeter ids in request metadata.
# Those overrides win over this file.

schema_version: "2.0"

projects:

  project1:
    name: "Project1"
    aliases:
      - "AIPTE"
      - "PerfPilotOS"
    certificate_profile:
      type: "mtls"
      profile_id: "project1"
      jks_file: "project1.jks"
      jks_password_env: "JMETER_JKS_PWD_PROJECT1"
      cert_alias_variable: "certAlias"
      alias_start_index: 0
      alias_end_index: 1999
      test_users_csv: "project1-test-users.csv"
      csv_variable_names: "userId,userName,userEmail,certAlias"
      auth_template: "entra-id-mtls"
      default_cert_cn: "perftest001"
      default_user_email: "performance001.testuser@example.com"
      allow_request_user_email_override: false
      cert_auto_select_pattern: "https://login.example.com"
    load_testing:
      provider: blazemeter
      workspace_id: "1234567"
      # Optional when the BlazeMeter project id is already known.
      # project_id: "7654321"
    project_management:
      provider: azure_devops
      organization: "my-org"
      project: "Project1"
      url: "https://dev.azure.com/my-org/Project1"
    documentation:
      provider: confluence
      mode: cloud
      space_name: "Performance Test Engineering"
      space_ref: "PTE"
      base_url: "https://my-org.atlassian.net"
      publishing:
        parent_page_name: "AI Generated Test Reports"
        parent_page_id: "987654"
    environments:
      QA:
        url: "https://qa.example.com"
        label: "QA"
        description: "QA testing environment"
      UAT:
        url: "https://uat.example.com/"
        label: "UAT"
        description: "UAT testing environment"

  # Illustrative Jira-backed project. The framework records these fields.
  # A Jira adapter is not required for the example to load.
  project2:
    name: "Project2"
    aliases:
      - "JIRADEMO"
    load_testing:
      provider: blazemeter
      workspace_id: "1234567"
    project_management:
      provider: jira
      site_url: "https://example.atlassian.net"
      project_key: "PERF"
      project_name: "Performance"
      # cloud_id: optional Atlassian site id for OAuth 3LO
    documentation:
      provider: confluence
      mode: cloud
      space_name: "Performance"
      space_ref: "PERF"
      base_url: "https://example.atlassian.net"
    environments:
      QA:
        url: "https://qa.example.com"
        label: "QA"
        description: "QA testing environment"
