# =============================================================================
# perfpilot-mcp-datadog — standalone spin-up
#
# Usage (from this folder):
#   cp .env.example .env    # then fill in Datadog credentials
#   docker compose up --build -d
# =============================================================================

services:
  perfpilot-mcp-datadog:
    build:
      context: ../..
      dockerfile: docker/datadog-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-datadog:latest
    container_name: perfpilot-mcp-datadog
    env_file:
      - path: .env
        required: false
    environment:
      - PERFPLOT_SECRETS_MASTER_KEY=${PERFPLOT_SECRETS_MASTER_KEY:-}
      - PERFAGENT_STATE_HOST=${PERFAGENT_STATE_HOST:-host.docker.internal}
      - PERFAGENT_STATE_PORT=${PERFAGENT_STATE_PORT:-5432}
      - PERFAGENT_STATE_DB=${PERFAGENT_STATE_DB:-perfagent_state}
      - PERFAGENT_STATE_USER=${PERFAGENT_STATE_USER}
      - PERFAGENT_STATE_PASSWORD=${PERFAGENT_STATE_PASSWORD}
      - PERFAGENT_STATE_SSLMODE=${PERFAGENT_STATE_SSLMODE:-prefer}
    ports:
      - "8111:8111"
    volumes:
      - ../../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
