# =============================================================================
# PerfPilot Hub — Full Stack (macOS)
#   Gateway + PerfMemory DB + Playwright MCP + Agent Backend + Frontend
# =============================================================================
# Usage:
#   1. Copy .env.gateway.example to .env.gateway and fill in your values
#   2. Copy config/*.example.yaml files to their non-example counterparts
#   3. Run: docker compose -f docker-compose-full-mac.yaml up --build
#
# Services:
#   perf-gateway    — MCP gateway aggregator (port 8888)
#   perfmemory-db   — PostgreSQL with pgvector + AGE (port 5432)
#   playwright-mcp  — Microsoft Playwright MCP for browser automation (port 8931)
#   agent-a2a       — A2A protocol server (port 8001)
#   agent-agui      — AG-UI protocol server (port 8002)
#   frontend        — Next.js web UI (port 3000)
#
# macOS note: The perfmemory-db service uses explicit user/PGDATA settings
# to avoid file permission issues with Docker Desktop on macOS.
# =============================================================================

services:
  perf-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-hub-full:latest
    container_name: perf-gateway
    ports:
      - "8888:8888"
    env_file:
      - .env.gateway
    environment:
      - PERFPILOT_DOCKER=true
      - GATEWAY_TRANSPORT=http
      - GATEWAY_PORT=8888
      - FASTMCP_CHECK_FOR_UPDATES=off
      # Override POSTGRES_HOST to use the internal Docker network service name
      - POSTGRES_HOST=perfmemory-db
      - POSTGRES_PORT=5432
    volumes:
      # Artifacts (persisted on host)
      - ../mcp-perf-suite/artifacts:/app/artifacts
      # Gateway config
      - ./config/gateway/config.yaml:/app/gateway-mcp/config.yaml:ro
      # BlazeMeter config
      - ./config/blazemeter/config.yaml:/app/blazemeter-mcp/config.yaml:ro
      # Datadog config
      - ./config/datadog/config.yaml:/app/datadog-mcp/config.yaml:ro
      - ./config/datadog/environments.json:/app/datadog-mcp/environments.json:ro
      - ./config/datadog/custom_queries.json:/app/datadog-mcp/custom_queries.json:ro
      # PerfAnalysis config
      - ./config/perfanalysis/config.yaml:/app/perfanalysis-mcp/config.yaml:ro
      - ./config/perfanalysis/slas.yaml:/app/perfanalysis-mcp/slas.yaml:ro
      # PerfReport config
      - ./config/perfreport/config.yaml:/app/perfreport-mcp/config.yaml:ro
      - ./config/perfreport/report_config.yaml:/app/perfreport-mcp/report_config.yaml:ro
      - ./config/perfreport/chart_schema.yaml:/app/perfreport-mcp/chart_schema.yaml:ro
      - ./config/perfreport/chart_colors.yaml:/app/perfreport-mcp/chart_colors.yaml:ro
      # Confluence config
      - ./config/confluence/config.yaml:/app/confluence-mcp/config.yaml:ro
      # JMeter config
      - ./config/jmeter/config.yaml:/app/jmeter-mcp/config.yaml:ro
      - ./config/jmeter/jmeter_config.yaml:/app/jmeter-mcp/jmeter_config.yaml:ro
      - ./config/jmeter/correlation_config.yaml:/app/jmeter-mcp/correlation_config.yaml:ro
      # JMeter test-specs (subfolder structure: web-flows/, azure-devops/, etc.)
      - ./config/jmeter/test-specs:/app/jmeter-mcp/test-specs:ro
      # JMeter properties overrides (optional — appended to jmeter.properties at startup)
      - ./config/jmeter/jmeter-overrides.properties:/app/jmeter-config/jmeter-overrides.properties:ro
      # JMeter client certs (optional — place .jks files here, configure via env vars)
      - ./certs/jmeter/:/app/jmeter-certs/:ro
      # PerfMemory config
      - ./config/perfmemory/config.yaml:/app/perfmemory-mcp/config.yaml:ro
      - ./config/perfmemory/taxonomy.yaml:/app/perfmemory-mcp/taxonomy.yaml:ro
      # Playwright output (bind mount shared with playwright-mcp container)
      - ../.playwright-mcp:/app/.playwright-mcp
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8888/health || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      perfmemory-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  perfmemory-db:
    build:
      context: .
      dockerfile: Dockerfile.pgvector-age
    image: perfmem-pgvector-age:latest
    container_name: perfmem-pgvector-age
    user: "999:999"
    env_file:
      - .env.gateway
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/18/docker/pgdata
    volumes:
      - ./data/pgvectordb:/var/lib/postgresql/18/docker
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - perf-network

  playwright-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile.playwright-mcp
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: playwright-mcp:latest
    container_name: playwright-mcp
    user: "0:0"
    ports:
      - "8931:8931"
    command: ["--port", "8931", "--host", "0.0.0.0", "--allowed-hosts", "*", "--caps", "devtools", "--ignore-https-errors", "--config", "/app/config.json"]
    volumes:
      - ../.playwright-mcp:/home/node/output
      - ./config/playwright/config.json:/app/config.json:ro
    restart: unless-stopped
    networks:
      - perf-network

  agent-a2a:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-backend
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perf-agent-backend:latest
    container_name: agent-a2a
    ports:
      - "8001:8001"
    env_file:
      - .env.gateway
    environment:
      - PERFPILOT_DOCKER=true
      - GATEWAY_MCP_URL=http://perf-gateway:8888/mcp
      - PLAYWRIGHT_MCP_URL=http://playwright-mcp:8931/mcp
      - PERFAGENT_STATE_HOST=perfmemory-db
      - PERFAGENT_STATE_PORT=5432
      - PERFAGENT_STATE_DB=perfagent_state
      - PERFAGENT_STATE_USER=${POSTGRES_USER}
      - PERFAGENT_STATE_PASSWORD=${POSTGRES_PASSWORD}
      - HEALTHCHECK_PORT=8001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      perfmemory-db:
        condition: service_healthy
      perf-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  agent-agui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-backend
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perf-agent-backend:latest
    container_name: agent-agui
    ports:
      - "8002:8002"
    env_file:
      - .env.gateway
    environment:
      - PERFPILOT_DOCKER=true
      - GATEWAY_MCP_URL=http://perf-gateway:8888/mcp
      - PLAYWRIGHT_MCP_URL=http://playwright-mcp:8931/mcp
      - PERFAGENT_STATE_HOST=perfmemory-db
      - PERFAGENT_STATE_PORT=5432
      - PERFAGENT_STATE_DB=perfagent_state
      - PERFAGENT_STATE_USER=${POSTGRES_USER}
      - PERFAGENT_STATE_PASSWORD=${POSTGRES_PASSWORD}
      - HEALTHCHECK_PORT=8002
    command: ["python", "agui_server.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 5
    depends_on:
      perfmemory-db:
        condition: service_healthy
      agent-a2a:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.agent-frontend
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perf-agent-frontend:latest
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - AGUI_BACKEND_URL=http://agent-agui:8002
      - A2A_BACKEND_URL=http://agent-a2a:8001
      - FRONTEND_PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      agent-agui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

networks:
  perf-network:
    driver: bridge
