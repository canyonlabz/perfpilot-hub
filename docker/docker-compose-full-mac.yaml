# =============================================================================
# PerfPilot Hub — Full stack (macOS / Docker Desktop with VirtioFS)
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in your values.
#   2. (Optional) Place corporate CA bundle in docker/certs/corporate/ and
#      set ENABLE_CORP_CA=true in .env.
#   3. Run: docker compose -f docker/docker-compose-full-mac.yaml up --build
#
# macOS note:
#   The perfmem-pgvector-age service sets `user: "999:999"` and
#   `PGDATA=/var/lib/postgresql/18/docker/pgdata` to work around a
#   Docker-Desktop-for-Mac VirtioFS ownership issue where PG 18's
#   initdb cannot chown the bind-mount root. This file is otherwise
#   identical to docker-compose-full-windows.yaml.
#
# Services (14 containers, 13 Dockerfiles — agent-backend is built once and
# tagged twice):
#
#   Database
#     perfmem-pgvector-age            :5432   (PostgreSQL 18 + pgvector + AGE)
#
#   Gateway-mounted MCPs (perfpilot-mcp-*)
#     perfpilot-mcp-blazemeter        :8110
#     perfpilot-mcp-datadog           :8111
#     perfpilot-mcp-jmeter            :8112
#     perfpilot-mcp-perfanalysis      :8113
#     perfpilot-mcp-perfreport        :8114
#     perfpilot-mcp-confluence        :8115
#     perfpilot-mcp-perfmemory        :8116
#     perfpilot-mcp-github            :8118
#
#   Aggregator + standalone MCPs
#     perfpilot-mcp-gateway           :8125   (aggregates the 8 above)
#     perfpilot-mcp-playwright        :8117   (vendor image, /mcp)
#
#   Agent backend (single Dockerfile, two image tags)
#     perfpilot-a2a                   :8101
#     perfpilot-agui                  :8102
#
#   Frontend
#     perfpilot-ui                    :8080   (Next.js)
#
# Configs are baked into each image — this file has zero config bind
# mounts. Only `artifacts/` and `.playwright-mcp/` are mounted at runtime.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Database  (macOS: user + PGDATA workarounds for VirtioFS)
  # ---------------------------------------------------------------------------
  perfmem-pgvector-age:
    build:
      context: ..
      dockerfile: docker/postgresql/Dockerfile
    image: perfmem-pgvector-age:latest
    container_name: perfmem-pgvector-age
    # macOS: force container process UID to match the image's postgres user.
    user: "999:999"
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # macOS: initdb cannot chown the bind-mount root; use a sub-directory.
      PGDATA: /var/lib/postgresql/18/docker/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind mount is required — named volumes fail on this image because
      # PG 18's initdb cannot chown the docker-managed volume root.
      - ./data/pgvectordb:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - perf-network

  # ---------------------------------------------------------------------------
  # Gateway-mounted MCPs (Dockerfile-managed healthchecks probe their own
  # /perfpilot-mcp-<name>/mcp endpoint on the container port)
  # ---------------------------------------------------------------------------
  perfpilot-mcp-blazemeter:
    build:
      context: ..
      dockerfile: docker/blazemeter-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-blazemeter:latest
    container_name: perfpilot-mcp-blazemeter
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8110:8110"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-datadog:
    build:
      context: ..
      dockerfile: docker/datadog-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-datadog:latest
    container_name: perfpilot-mcp-datadog
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8111:8111"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-jmeter:
    build:
      context: ..
      dockerfile: docker/jmeter-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-jmeter:latest
    container_name: perfpilot-mcp-jmeter
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8112:8112"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
      # Shared with perfpilot-mcp-playwright so JMeter can parse the trace files
      - ../.playwright-mcp:/app/.playwright-mcp
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-perfanalysis:
    build:
      context: ..
      dockerfile: docker/perfanalysis-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-perfanalysis:latest
    container_name: perfpilot-mcp-perfanalysis
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8113:8113"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-perfreport:
    build:
      context: ..
      dockerfile: docker/perfreport-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-perfreport:latest
    container_name: perfpilot-mcp-perfreport
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8114:8114"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-confluence:
    build:
      context: ..
      dockerfile: docker/confluence-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-confluence:latest
    container_name: perfpilot-mcp-confluence
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8115:8115"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-perfmemory:
    build:
      context: ..
      dockerfile: docker/perfmemory-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-perfmemory:latest
    container_name: perfpilot-mcp-perfmemory
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8116:8116"
    volumes:
      - ../mcp-perf-suite/artifacts:/app/artifacts
    depends_on:
      perfmem-pgvector-age:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-mcp-github:
    build:
      context: ..
      dockerfile: docker/github-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-github:latest
    container_name: perfpilot-mcp-github
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8118:8118"
    restart: unless-stopped
    networks:
      - perf-network

  # ---------------------------------------------------------------------------
  # Gateway (aggregates the 8 MCPs above via HTTP-mount)
  # ---------------------------------------------------------------------------
  perfpilot-mcp-gateway:
    build:
      context: ..
      dockerfile: docker/gateway-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-gateway:latest
    container_name: perfpilot-mcp-gateway
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
    ports:
      - "8125:8125"
    depends_on:
      perfpilot-mcp-blazemeter:
        condition: service_healthy
      perfpilot-mcp-datadog:
        condition: service_healthy
      perfpilot-mcp-jmeter:
        condition: service_healthy
      perfpilot-mcp-perfanalysis:
        condition: service_healthy
      perfpilot-mcp-perfreport:
        condition: service_healthy
      perfpilot-mcp-confluence:
        condition: service_healthy
      perfpilot-mcp-perfmemory:
        condition: service_healthy
      perfpilot-mcp-github:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  # ---------------------------------------------------------------------------
  # Playwright MCP (vendor image, endpoint /mcp only, no path prefix)
  # ---------------------------------------------------------------------------
  perfpilot-mcp-playwright:
    build:
      context: ..
      dockerfile: docker/playwright-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-playwright:latest
    container_name: perfpilot-mcp-playwright
    user: "0:0"
    env_file:
      - .env
    ports:
      - "8117:8117"
    command:
      - "--port"
      - "8117"
      - "--host"
      - "0.0.0.0"
      - "--allowed-hosts"
      - "*"
      - "--caps"
      - "devtools"
      - "--ignore-https-errors"
      - "--headless"
      - "--browser"
      - "chromium"
      - "--output-dir"
      - "/home/node/output"
    volumes:
      - ../.playwright-mcp:/home/node/output
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://localhost:8117/mcp || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - perf-network

  # ---------------------------------------------------------------------------
  # Agent backend — single Dockerfile, two image tags, two CMDs
  # ---------------------------------------------------------------------------
  perfpilot-a2a:
    build:
      context: ..
      dockerfile: docker/agent-backend/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-a2a:latest
    container_name: perfpilot-a2a
    command: ["python", "a2a_server.py"]
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - A2A_PORT=8101
      - HEALTHCHECK_PORT=8101
    ports:
      - "8101:8101"
    depends_on:
      perfmem-pgvector-age:
        condition: service_healthy
      perfpilot-mcp-gateway:
        condition: service_healthy
      perfpilot-mcp-playwright:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  perfpilot-agui:
    build:
      context: ..
      dockerfile: docker/agent-backend/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-agui:latest
    container_name: perfpilot-agui
    command: ["python", "agui_server.py"]
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - AGUI_PORT=8102
      - HEALTHCHECK_PORT=8102
    ports:
      - "8102:8102"
    depends_on:
      perfpilot-a2a:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

  # ---------------------------------------------------------------------------
  # Frontend (Next.js dev-mode container)
  # ---------------------------------------------------------------------------
  perfpilot-ui:
    build:
      context: ..
      dockerfile: docker/agent-frontend/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-ui:latest
    container_name: perfpilot-ui
    env_file:
      - .env
    environment:
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-local}
      - PORT=8080
      - FRONTEND_PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      perfpilot-agui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - perf-network

networks:
  perf-network:
    driver: bridge
