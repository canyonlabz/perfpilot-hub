# =============================================================================
# perfpilot-mcp-playwright — standalone spin-up
#
# Usage (from this folder):
#   cp .env.example .env    # optional — only needed for corp CA / mTLS
#   docker compose up --build -d
#
# Notes:
#   • Built from the Microsoft Playwright base image + @playwright/mcp
#     npm package. Endpoint is `/mcp` (no per-service prefix — the
#     vendor MCP does not accept one), so MCP_TRANSPORT / MCP_HTTP_PREFIX
#     are NOT set here.
#   • `user: "0:0"` is intentional. The bind mount below maps the host
#     `.playwright-mcp/` directory into the container so JMeter can
#     consume traces / HAR files. Running as root sidesteps UID
#     mismatches between the container's `node` user (uid 1000) and
#     arbitrary host owners on macOS / Linux; on Windows Docker Desktop
#     the mount proxy makes UID moot either way.
#   • Runtime browser flags live in the image entrypoint (headless,
#     chromium, --allowed-hosts, --caps devtools, --ignore-https-errors,
#     --config /app/config.json). Nothing here duplicates them.
#   • Optional mTLS: set PLAYWRIGHT_CERT_FILE +
#     PLAYWRIGHT_CERT_PASSPHRASE (+ optional
#     PLAYWRIGHT_CERT_AUTO_SELECT_CN / PATTERN) in .env after placing
#     the cert file in docker/certs/playwright/ so it gets baked into
#     the image at /certs.
# =============================================================================

services:
  perfpilot-mcp-playwright:
    build:
      context: ../..
      dockerfile: docker/playwright-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-playwright:latest
    container_name: perfpilot-mcp-playwright
    user: "0:0"
    env_file:
      - path: .env
        required: false
    environment:
      - HTTP_PORT=8117
      - PERFPILOT_DOCKER=true
    ports:
      - "8117:8117"
    volumes:
      - ../../.playwright-mcp:/home/node/output
    restart: unless-stopped
