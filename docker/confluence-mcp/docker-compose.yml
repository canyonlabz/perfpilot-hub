# =============================================================================
# perfpilot-mcp-confluence — standalone spin-up
#
# Usage (from this folder):
#   cp .env.example .env    # then fill in the Confluence credentials
#                           # (Cloud V2 or on-prem V1)
#   docker compose up --build -d
# =============================================================================

services:
  perfpilot-mcp-confluence:
    build:
      context: ../..
      dockerfile: docker/confluence-mcp/Dockerfile
      args:
        ENABLE_CORP_CA: ${ENABLE_CORP_CA:-false}
    image: perfpilot-mcp-confluence:latest
    container_name: perfpilot-mcp-confluence
    env_file:
      - path: .env
        required: false
    environment:
      - PERFPILOT_SECRETS_MASTER_KEY=${PERFPILOT_SECRETS_MASTER_KEY:-}
      - PERFAGENT_STATE_HOST=${PERFAGENT_STATE_HOST:-host.docker.internal}
      - PERFAGENT_STATE_PORT=${PERFAGENT_STATE_PORT:-5432}
      - PERFAGENT_STATE_DB=${PERFAGENT_STATE_DB:-perfagent_state}
      - PERFAGENT_STATE_USER=${PERFAGENT_STATE_USER}
      - PERFAGENT_STATE_PASSWORD=${PERFAGENT_STATE_PASSWORD}
      - PERFAGENT_STATE_SSLMODE=${PERFAGENT_STATE_SSLMODE:-prefer}
    ports:
      - "8115:8115"
    volumes:
      - ../../mcp-perf-suite/artifacts:/app/artifacts
    restart: unless-stopped
